# VibePod provider definition. Contains no credentials.
# OpenAI. Responses API; for Chat Completions import with --name and edit the protocol.
# Docs: https://platform.openai.com/docs/api-reference
version = 1
name = "openai"
protocol = "openai-responses"
base_url = "https://api.openai.com/v1"
auth = "env"
key_env = "OPENAI_API_KEY"
models = [
  "gpt-4.1",
  "gpt-4.1-mini",
  "gpt-4o",
  "gpt-4o-2024-08-06",
  "gpt-4o-2024-11-20",
  "gpt-4o-mini",
  "gpt-5",
  "gpt-5-mini",
  "gpt-5-nano",
  "gpt-5-pro",
  "gpt-5.1",
  "gpt-5.2",
  "gpt-5.2-pro",
  "gpt-5.3-codex",
  "gpt-5.3-codex-spark",
  "gpt-5.4",
  "gpt-5.4-mini",
  "gpt-5.4-nano",
  "gpt-5.4-pro",
  "gpt-5.5",
  "gpt-5.5-pro",
  "gpt-5.6",
  "gpt-5.6-luna",
  "gpt-5.6-sol",
  "gpt-5.6-terra",
  "gpt-6-astra",
  "gpt-6-luna",
  "gpt-6-sol",
  "gpt-realtime-2.1",
  "o3",
  "o3-pro",
]

[model_settings."gpt-4.1"]
context_window = 1047576
max_output_tokens = 32768
reasoning = false

