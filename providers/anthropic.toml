# VibePod provider definition. Contains no credentials.
# Anthropic Messages API. Clients append /v1 themselves.
# Docs: https://docs.anthropic.com/en/api
version = 1
name = "anthropic"
protocol = "anthropic"
base_url = "https://api.anthropic.com"
auth = "env"
key_env = "ANTHROPIC_API_KEY"
models = [
  "claude-fable-5",
  "claude-fable-5-1",
  "claude-haiku-4-5",
  "claude-haiku-4-5-20251001",
  "claude-opus-4-5",
  "claude-opus-4-5-20251101",
  "claude-opus-4-6",
  "claude-opus-4-7",
  "claude-opus-4-8",
  "claude-opus-5",
  "claude-opus-5-5",
  "claude-sonnet-4-5",
  "claude-sonnet-4-5-20250929",
  "claude-sonnet-4-6",
  "claude-sonnet-5",
]

[model_settings."claude-fable-5"]
context_window = 1000000
max_output_tokens = 128000
reasoning = true
reasoning_levels = ["low", "medium", "high", "xhigh"]

