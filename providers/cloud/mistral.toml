# VibePod provider definition. Contains no credentials.
# Mistral AI.
# Docs: https://docs.mistral.ai
version = 1
name = "mistral"
protocol = "openai-chat"
base_url = "https://api.mistral.ai/v1"
auth = "env"
key_env = "MISTRAL_API_KEY"
models = [
  "codestral-latest",
  "magistral-medium-latest",
  "magistral-small",
  "ministral-3b-latest",
  "ministral-8b-latest",
  "mistral-large-2411",
  "mistral-large-2512",
  "mistral-large-latest",
  "mistral-medium-2505",
  "mistral-medium-2508",
  "mistral-medium-2604",
  "mistral-medium-latest",
  "mistral-nemo",
  "mistral-small-2506",
  "mistral-small-2603",
  "mistral-small-latest",
  "open-mistral-7b",
  "open-mixtral-8x22b",
  "open-mixtral-8x7b",
  "pixtral-12b",
  "pixtral-large-latest",
  "voxtral-small-latest",
  "zai-glm-5-2",
  "zai-glm-5-3",
]

[model_settings."codestral-latest"]
context_window = 256000
max_output_tokens = 4096
reasoning = false

