# VibePod provider definition. Contains no credentials.
# Entrim, OpenAI-compatible endpoint for open-weight models.
# Docs: https://entrim.ai
version = 1
name = "entrim"
protocol = "openai-chat"
base_url = "https://api.entrim.ai/v1"
auth = "env"
key_env = "ENTRIM_API_KEY"
models = [
  "Qwen/Qwen3.6-27B",
  "Qwen/Qwen3.6-35B-A3B",
  "Qwen/Qwen3.8-27B",
  "deepseek-ai/DeepSeek-V4-Flash",
  "zai-org/GLM-5.3-Flash",
]

[model_settings."Qwen/Qwen3.6-27B"]
context_window = 262144
max_output_tokens = 65536
reasoning = true

[model_settings."Qwen/Qwen3.6-35B-A3B"]
context_window = 262144
max_output_tokens = 65536
reasoning = true

[model_settings."Qwen/Qwen3.8-27B"]
context_window = 131042
max_output_tokens = 16384
reasoning = true
reasoning_levels = ["off", "low", "medium", "high"]

[model_settings."deepseek-ai/DeepSeek-V4-Flash"]
context_window = 1000000
max_output_tokens = 393216
reasoning = true
reasoning_levels = ["low", "high"]

[model_settings."zai-org/GLM-5.3-Flash"]
context_window = 1000000
max_output_tokens = 131072
reasoning = true
reasoning_levels = ["low", "high"]
