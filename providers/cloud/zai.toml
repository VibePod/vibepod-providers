# VibePod provider definition. Contains no credentials.
# Z.ai (GLM), OpenAI-compatible endpoint.
# Docs: https://docs.z.ai
version = 1
name = "zai"
protocol = "openai-chat"
base_url = "https://api.z.ai/api/paas/v4"
auth = "env"
key_env = "ZHIPU_API_KEY"
models = [
  "glm-4.5",
  "glm-4.5-air",
  "glm-4.5-flash",
  "glm-4.5v",
  "glm-4.6",
  "glm-4.6v",
  "glm-4.6v-flash",
  "glm-4.7",
  "glm-4.7-flash",
  "glm-4.7-flashx",
  "glm-5",
  "glm-5-turbo",
  "glm-5.1",
  "glm-5.2",
  "glm-5.3",
  "glm-5.3-flash",
  "glm-5.3-flashx",
  "glm-5v-turbo",
]

[model_settings."glm-4.5"]
context_window = 131072
max_output_tokens = 98304
reasoning = true

