# VibePod provider definition. Contains no credentials.
# MiniMax, OpenAI-compatible endpoint.
# Docs: https://platform.minimax.io/docs
version = 1
name = "minimax"
protocol = "openai-chat"
base_url = "https://api.minimax.io/v1"
auth = "env"
key_env = "MINIMAX_API_KEY"
models = [
  "MiniMax-M2",
  "MiniMax-M2.1",
  "MiniMax-M2.5",
  "MiniMax-M2.5-highspeed",
  "MiniMax-M2.7",
  "MiniMax-M2.7-highspeed",
  "MiniMax-M3",
]

[model_settings."MiniMax-M2"]
context_window = 204800
max_output_tokens = 131072
reasoning = true

[model_settings."MiniMax-M2.1"]
context_window = 204800
max_output_tokens = 131072
reasoning = true

[model_settings."MiniMax-M2.5"]
context_window = 204800
max_output_tokens = 131072
reasoning = true

[model_settings."MiniMax-M2.5-highspeed"]
context_window = 204800
max_output_tokens = 131072
reasoning = true

[model_settings."MiniMax-M2.7"]
context_window = 204800
max_output_tokens = 131072
reasoning = true

[model_settings."MiniMax-M2.7-highspeed"]
context_window = 204800
max_output_tokens = 131072
reasoning = true

[model_settings."MiniMax-M3"]
context_window = 1000000
max_output_tokens = 512000
reasoning = true
